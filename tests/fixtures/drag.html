<!doctype html><meta charset="utf-8"><title>Drag fixture</title>
<a href="/drag-link" draggable="true" style="position:fixed;left:10px;top:10px;width:150px;height:50px;display:block">Drag fixture link</a>
<img src="/drag-image.png" draggable="true" style="position:fixed;left:300px;top:10px;width:64px;height:64px">
