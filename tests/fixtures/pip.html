<!doctype html><meta charset="utf-8"><title>Native PiP fixture</title>
<button id="start" style="position:absolute;left:0;top:0;width:200px;height:60px">Start video</button>
<canvas id="canvas" width="160" height="90" hidden></canvas>
<video id="primary" muted playsinline style="position:absolute;left:0;top:80px;width:320px;height:180px"></video>
<video id="secondary" muted playsinline style="position:absolute;left:340px;top:80px;width:320px;height:180px"></video>
<script>
let tick=0;function paint(){const c=canvas.getContext('2d');c.fillStyle=`hsl(${tick++*7%360} 90% 50%)`;c.fillRect(0,0,160,90);requestAnimationFrame(paint)}paint();
primary.srcObject=canvas.captureStream(20);secondary.srcObject=canvas.captureStream(20);
start.onclick=()=>primary.play();
</script>
